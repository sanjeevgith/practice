<div class="row g-3">
@for (item of postDataResponse(); track item.id ?? $index) {
  <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body" >
          <h5 class="card-title">Card {{item.id}}</h5>
          <p class="card-text">{{item.title}}</p>
          <button class="btn btn-danger" (click)="removeTodo(item.id)">Remove</button>
          <button (click)="openModal(item)" class="btn btn-success">Description</button>
        </div>
      </div>
    </div>
}
@empty {
  <p>Loading...</p>
}
</div>
<button (click)="goToLanding()" [ngClass]="{'active':true}" >Go To AC Deatils</button>

<app-popup
  [isOpen]="modalOpen"
  [title]="modalTitle"
  [body]="modalBody"
  (close)="closeModal()"
  (save)="saveModal()">
</app-popup>
